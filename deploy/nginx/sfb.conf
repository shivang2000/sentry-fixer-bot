# sentry-fixer-bot reverse proxy
# Drop into /etc/nginx/sites-available/sfb.conf and symlink to sites-enabled.
# Replace <YOUR_DOMAIN> and run `certbot --nginx -d <YOUR_DOMAIN>` for TLS.

upstream sfb_server {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name <YOUR_DOMAIN>;

  # ACME challenge for certbot; everything else goes through TLS server below.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name <YOUR_DOMAIN>;

  ssl_certificate     /etc/letsencrypt/live/<YOUR_DOMAIN>/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/<YOUR_DOMAIN>/privkey.pem;

  # Hardening
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Sentry webhooks can be large
  client_max_body_size 8m;

  # WebSocket (chat) upgrade
  location /api/chat/ {
    proxy_pass http://sfb_server;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://sfb_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
