name: sentry-fixer-bot-test

services:
  postgres:
    image: postgres:16
    container_name: sfb-test-postgres
    environment:
      POSTGRES_DB: sentry-fixer-bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - sfb_test_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentry-fixer-bot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  sfb:
    container_name: sfb-test-app
    build:
      # Cloned from the public repo inside the Dockerfile — no host repo
      # is shipped into the build context.
      context: .
      dockerfile: Dockerfile
      args:
        # Override on the CLI to force a fresh git clone, e.g.:
        #   docker compose build --build-arg SFB_REV=$(date +%s)
        SFB_REV: ${SFB_REV:-main}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/sentry-fixer-bot
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:3000
      BETTER_AUTH_SECRET: docker-test-secret-not-for-production-use-please
      DEPLOYMENT_MODE: authenticated
      SERVER_BIND: custom
      SERVER_BIND_HOST: 0.0.0.0
      SFB_RUN_MODE: container
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  sfb_test_postgres:
