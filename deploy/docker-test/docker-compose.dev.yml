name: alertforge-dev

# Local development:
#   * Bind-mounts the host repo into the container so edits are visible
#     immediately (no rebuild).
#   * Anonymous volumes mask every node_modules / dist / public path so
#     a host-side `bun install` (which produces macOS arm64 binaries)
#     can't leak into the Linux container.
#   * `bun install` runs inside the container on first up; cached in
#     the named `alertforge_dev_node_modules_*` volumes after.
#   * DEPLOYMENT_MODE=local_trusted bootstraps the local-board admin
#     automatically — no /sign-up needed; visit / and you're admin.
#   * One named volume — alertforge_dev_state — mounted at /alertforge/state holds
#     EVERY piece of mutable per-instance state: alertforge-runner's HOME
#     (.claude / .config/gh / future .codex / .opencloud / .npm / .cache),
#     /alertforge/state/etc/env (the UI-mutated env file), /alertforge/state/work
#     (per-session work dirs), /alertforge/state/skills (uploaded skills).
#     A crash + container recreate restores all of it.

services:
  postgres:
    image: postgres:16
    container_name: alertforge-dev-postgres
    environment:
      POSTGRES_DB: alertforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - alertforge_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alertforge"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  alertforge:
    container_name: alertforge-dev-app
    build:
      context: ../..
      dockerfile: deploy/docker-test/Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/alertforge
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:3000
      VITE_SERVER_URL: http://localhost:3000
      BETTER_AUTH_SECRET: dev-only-secret-not-for-production-use-this
      DEPLOYMENT_MODE: local_trusted
      SERVER_BIND: loopback
      SERVER_BIND_HOST: 0.0.0.0
      ALERTFORGE_RUN_MODE: container
      ALERTFORGE_STATE_DIR: /alertforge/state
      NODE_ENV: production
      TURBO_FORCE: "true"
    ports:
      - "3000:3000"
    volumes:
      # Bind mount the host repo at the container's working directory.
      - ../..:/opt/alertforge/current
      # Anonymous volumes mask every host node_modules / build artefact
      # path so the Linux container keeps its own copies.
      - /opt/alertforge/current/node_modules
      - /opt/alertforge/current/apps/server/node_modules
      - /opt/alertforge/current/apps/server/dist
      - /opt/alertforge/current/apps/server/public
      - /opt/alertforge/current/apps/web/node_modules
      - /opt/alertforge/current/apps/web/dist
      - /opt/alertforge/current/packages/api/node_modules
      - /opt/alertforge/current/packages/auth/node_modules
      - /opt/alertforge/current/packages/config/node_modules
      - /opt/alertforge/current/packages/db/node_modules
      - /opt/alertforge/current/packages/env/node_modules
      - /opt/alertforge/current/packages/ui/node_modules
      # The one and only persistent state volume. Everything the operator
      # configures + every cred + every chat session's work dir lives here.
      - alertforge_dev_state:/alertforge/state
    restart: unless-stopped

volumes:
  alertforge_dev_postgres:
  alertforge_dev_state:
