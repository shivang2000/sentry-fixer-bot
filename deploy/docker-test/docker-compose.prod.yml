name: sentry-fixer-bot-prod

# Production-shaped local test:
#   * Dockerfile.prod clones the public repo at build time and bakes
#     `bun install --frozen-lockfile` into the image (no host source).
#   * Postgres sidecar uses a named volume so data persists across
#     `docker compose down` (use `down -v` to wipe).
#   * Authenticated mode + first-signup-admin flow — matches what a real
#     deployment runs. The startup-doctor will refuse to boot unless
#     PUBLIC_BASE_URL is https, so for a local run we leave the
#     deployment mode at local_trusted (bootstraps the local-board admin
#     automatically). Switch to authenticated + https in real prod.

services:
  postgres:
    image: postgres:16
    container_name: sfb-prod-postgres
    environment:
      POSTGRES_DB: sentry-fixer-bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - sfb_prod_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentry-fixer-bot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  sfb:
    container_name: sfb-prod-app
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        # Bump to force a fresh git clone:
        #   docker compose -f docker-compose.prod.yml build --build-arg SFB_REV=$(date +%s)
        SFB_REV: ${SFB_REV:-main}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/sentry-fixer-bot
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:3000
      VITE_SERVER_URL: http://localhost:3000
      BETTER_AUTH_SECRET: docker-test-secret-not-for-production-use-please
      DEPLOYMENT_MODE: local_trusted
      SERVER_BIND: loopback
      SERVER_BIND_HOST: 0.0.0.0
      SFB_RUN_MODE: container
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  sfb_prod_postgres:
